[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.public_paid]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.30"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./launches/public-paid-v1" }]
